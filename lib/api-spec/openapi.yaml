openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Sushruth - AI Healthcare Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: triage
    description: AI symptom triage operations
  - name: reports
    description: Medical report operations
  - name: appointments
    description: Appointment management
  - name: healthRecords
    description: Personal health records
  - name: tracker
    description: Health tracking data
  - name: careCircle
    description: Care circle / family members
  - name: medications
    description: Medications and reminders
  - name: openai
    description: OpenAI AI chat, image, and audio operations
  - name: profile
    description: User profile management
  - name: emergency
    description: Emergency access code management
  - name: prescriptions
    description: Reviewed prescription storage and OCR
  - name: children
    description: Child profiles, guardians, and immunizations
  - name: portal
    description: Patient and doctor portal operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health-worker/registration/status:
    get:
      operationId: getHealthWorkerRegistrationStatus
      tags: [healthWorker]
      responses:
        "200": { description: Registration status, content: { application/json: { schema: { $ref: "#/components/schemas/HealthWorkerRegistrationStatus" } } } }
        "404": { description: Not registered }
  /health-worker/registration:
    post:
      operationId: submitHealthWorkerRegistration
      tags: [healthWorker]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HealthWorkerRegistrationInput" } } } }
      responses: { "201": { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } } }
  /health-worker/registration/profile:
    patch:
      operationId: updateHealthWorkerRegistrationProfile
      tags: [healthWorker]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HealthWorkerRegistrationUpdate" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } } }
  /facilities/public:
    get:
      operationId: searchPublicFacilities
      tags: [facilities]
      parameters: [{ name: q, in: query, required: false, schema: { type: string, maxLength: 200 } }]
      responses: { "200": { description: Active facilities, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PublicFacility" } } } } } }
  /facilities/staff-requests:
    get:
      operationId: listFacilityStaffRequests
      tags: [facilities]
      responses: { "200": { description: Pending staff requests, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FacilityStaffRequest" } } } } } }
  /facilities/staff-requests/{id}/approve:
    post:
      operationId: approveFacilityStaffRequest
      tags: [facilities]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Approved request, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } } }
  /facilities/staff-requests/{id}/reject:
    post:
      operationId: rejectFacilityStaffRequest
      tags: [facilities]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffRequestRejection" } } } }
      responses: { "200": { description: Rejected request, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } } }

  # ---- SIH26133 CONTINUITY OF CARE ----
  /health-worker/profile:
    get:
      operationId: getHealthWorkerProfile
      tags: [healthWorker]
      summary: Get the authenticated frontline worker profile
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
    put:
      operationId: upsertHealthWorkerProfile
      tags: [healthWorker]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HealthWorkerProfileInput" } } } }
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /health-worker/patients:
    get:
      operationId: searchHealthWorkerPatients
      tags: [healthWorker]
      parameters: [{ name: q, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: Patients, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SihRecord" } } } } }
    post:
      operationId: registerHealthWorkerPatient
      tags: [healthWorker]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PatientRegistrationInput" } } } }
      responses:
        "201": { description: Patient, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /health-worker/vitals:
    post:
      operationId: recordHealthWorkerVitals
      tags: [healthWorker]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VitalsInput" } } } }
      responses:
        "201": { description: Vitals, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /referrals:
    get:
      operationId: listReferrals
      tags: [referrals]
      parameters: [{ name: status, in: query, required: false, schema: { type: string } }, { name: patientUserId, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: Referrals, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SihRecord" } } } } }
    post:
      operationId: createReferral
      tags: [referrals]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReferralInput" } } } }
      responses:
        "201": { description: Referral, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /referrals/{id}/status:
    patch:
      operationId: updateReferralStatus
      tags: [referrals]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReferralStatusInput" } } } }
      responses:
        "200": { description: Referral, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /follow-ups:
    get:
      operationId: listFollowUps
      tags: [followUps]
      parameters: [{ name: status, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: Follow-ups, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SihRecord" } } } } }
    post:
      operationId: createFollowUp
      tags: [followUps]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FollowUpInput" } } } }
      responses:
        "201": { description: Follow-up, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /follow-ups/{id}/outcome:
    patch:
      operationId: recordFollowUpOutcome
      tags: [followUps]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FollowUpOutcomeInput" } } } }
      responses:
        "200": { description: Follow-up, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /facilities/{id}/memberships:
    post:
      operationId: addFacilityMembership
      tags: [facilities]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FacilityMembershipInput" } } } }
      responses: { "201": { description: Membership, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } } }
  /facilities/{id}/memberships/{userId}:
    patch:
      operationId: updateFacilityMembership
      tags: [facilities]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: userId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FacilityMembershipUpdate" } } } }
      responses: { "200": { description: Membership, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } } }
  /facilities:
    get:
      operationId: listFacilities
      tags: [facilities]
      parameters: [{ name: resource, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: Facilities, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SihRecord" } } } } }
    post:
      operationId: createFacility
      tags: [facilities]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FacilityInput" } } } }
      responses:
        "201": { description: Facility, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /facilities/dashboard:
    get:
      operationId: getFacilityDashboard
      tags: [facilities]
      responses:
        "200": { description: Operational dashboard, content: { application/json: { schema: { $ref: "#/components/schemas/FacilityDashboard" } } } }
  /facilities/{id}/inventory:
    get:
      operationId: listFacilityInventory
      tags: [inventory]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Inventory, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SihRecord" } } } } }
    post:
      operationId: upsertFacilityInventory
      tags: [inventory]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryInput" } } } }
      responses:
        "201": { description: Inventory item, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /inventory/search:
    get:
      operationId: searchFacilityInventory
      tags: [inventory]
      parameters: [{ name: medicine, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: Inventory availability, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SihRecord" } } } } }
  /maternal-profiles:
    get:
      operationId: listMaternalProfiles
      tags: [maternal]
      responses:
        "200": { description: Maternal profiles, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SihRecord" } } } } }
    post:
      operationId: upsertMaternalProfile
      tags: [maternal]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MaternalProfileInput" } } } }
      responses:
        "201": { description: Maternal profile, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /chronic-care:
    get:
      operationId: listChronicCareProfiles
      tags: [chronicCare]
      responses:
        "200": { description: Chronic profiles, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SihRecord" } } } } }
    post:
      operationId: createChronicCareProfile
      tags: [chronicCare]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChronicCareInput" } } } }
      responses:
        "201": { description: Chronic profile, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /investigations:
    get:
      operationId: listInvestigationRequests
      tags: [investigations]
      parameters: [{ name: status, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: Investigations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SihRecord" } } } } }
    post:
      operationId: createInvestigationRequest
      tags: [investigations]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InvestigationInput" } } } }
      responses:
        "201": { description: Investigation, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /investigations/{id}/status:
    patch:
      operationId: updateInvestigationStatus
      tags: [investigations]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InvestigationStatusInput" } } } }
      responses:
        "200": { description: Investigation, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }
  /facilities/{id}/resources:
    get:
      operationId: listFacilityResources
      tags: [facilities]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Resources, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SihRecord" } } } } }
    post:
      operationId: createFacilityResource
      tags: [facilities]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FacilityResourceInput" } } } }
      responses:
        "201": { description: Resource, content: { application/json: { schema: { $ref: "#/components/schemas/SihRecord" } } } }

  # ---- TRIAGE ----
  /triage:
    get:
      operationId: listTriageSessions
      tags: [triage]
      summary: List triage sessions for current user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of triage sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TriageSession"
    post:
      operationId: createTriageSession
      tags: [triage]
      summary: Create a new AI triage session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageInput"
      responses:
        "201":
          description: Triage result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageSession"

  /triage/{id}:
    get:
      operationId: getTriageSession
      tags: [triage]
      summary: Get a triage session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Triage session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageSession"
        "404":
          description: Not found
    delete:
      operationId: deleteTriageSession
      tags: [triage]
      summary: Delete a triage session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Session deleted
        "404":
          description: Not found

  /triage/summary:
    get:
      operationId: getTriageSummary
      tags: [triage]
      summary: Get triage stats summary for user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Triage summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageSummary"

  # ---- REPORTS ----
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List medical reports for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicalReport"
    post:
      operationId: createReport
      tags: [reports]
      summary: Upload and analyze a medical report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report created with AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalReport"

  /reports/extract-image:
    post:
      operationId: extractReportImage
      tags: [reports]
      summary: Extract text from a medical report image using AI vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageBase64, mimeType]
              properties:
                imageBase64:
                  type: string
                  description: Base64-encoded image data
                mimeType:
                  type: string
                  description: MIME type of the image (e.g. image/jpeg, image/png)
      responses:
        "200":
          description: Extracted text from the image
          content:
            application/json:
              schema:
                type: object
                required: [extractedText]
                properties:
                  extractedText:
                    type: string


  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a medical report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Medical report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalReport"
        "404":
          description: Not found
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a medical report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ---- APPOINTMENTS ----
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Book an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Appointment booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get appointment details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Cancel appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cancelled

  /doctors:
    get:
      operationId: listDoctors
      tags: [appointments]
      summary: List available doctors with filters
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: hospital
          in: query
          required: false
          schema:
            type: string
        - name: specialty
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doctor"

  # ---- HEALTH RECORDS ----
  /health-records:
    get:
      operationId: getHealthRecord
      tags: [healthRecords]
      summary: Get personal health record for user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Health record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecord"
    post:
      operationId: createHealthRecord
      tags: [healthRecords]
      summary: Create health record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRecordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecord"
    patch:
      operationId: updateHealthRecord
      tags: [healthRecords]
      summary: Update health record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRecordUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecord"

  /health-records/analyze-document:
    post:
      operationId: analyzeHealthDocument
      tags: [healthRecords]
      summary: Analyze a prescription or medical document image using AI vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageBase64, mimeType]
              properties:
                imageBase64:
                  type: string
                  description: Base64-encoded image data
                mimeType:
                  type: string
                  description: MIME type of the image
      responses:
        "200":
          description: Analyzed document data
          content:
            application/json:
              schema:
                type: object
                required: [extractedText, documentType, summary, suggestedMedications, suggestedConditions, suggestedAllergies]
                properties:
                  extractedText:
                    type: string
                  documentType:
                    type: string
                  summary:
                    type: string
                  suggestedMedications:
                    type: string
                  suggestedConditions:
                    type: string
                  suggestedAllergies:
                    type: string

  /health-records/analyze-patterns:
    post:
      operationId: analyzeHealthPatterns
      tags: [healthRecords]
      summary: Find cautious recurring patterns across a patient's health history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthPatternAnalysisInput"
      responses:
        "200":
          description: Recurring health observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthPatternAnalysis"

  /surgeries:
    get:
      operationId: listSurgeries
      tags: [healthRecords]
      summary: List surgery records
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of surgeries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Surgery"
    post:
      operationId: createSurgery
      tags: [healthRecords]
      summary: Add surgery record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurgeryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Surgery"

  /surgeries/{id}:
    delete:
      operationId: deleteSurgery
      tags: [healthRecords]
      summary: Delete a surgery record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ---- HEALTH TRACKER ----
  /tracker:
    get:
      operationId: listTrackerEntries
      tags: [tracker]
      summary: List health tracker entries
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
