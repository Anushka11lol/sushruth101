      responses: { "200": { description: Submissions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PreConsultation" } } } } } }
    post:
      operationId: createPreConsultation
      tags: [portal]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PreConsultationInput" } } } }
      responses: { "201": { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/PreConsultation" } } } } }
  /doctor/pre-consultations:
    get:
      operationId: listDoctorPreConsultations
      tags: [portal]
      parameters: [{ name: callerUserId, in: query, required: true, schema: { type: string } }, { name: status, in: query, required: false, schema: { type: string } }]
      responses: { "200": { description: Submissions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PreConsultation" } } } } } }
  /pre-consultations/{id}:
    get:
      operationId: getPreConsultation
      tags: [portal]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: callerUserId, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: Submission, content: { application/json: { schema: { $ref: "#/components/schemas/PreConsultation" } } } } }
    patch:
      operationId: reviewPreConsultation
      tags: [portal]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PreConsultationReview" } } } }
      responses: { "200": { description: Reviewed, content: { application/json: { schema: { $ref: "#/components/schemas/PreConsultation" } } } } }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ---- TRIAGE ----
    TriageInput:
      type: object
      required: [userId, symptoms]
      properties:
        userId:
          type: string
        symptoms:
          type: string
        language:
          type: string
          default: "en"
        voiceInput:
          type: boolean
          default: false

    TriageSession:
      type: object
      required: [id, userId, symptoms, urgencyLevel, specialistRecommended, careSuggestion, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        symptoms:
          type: string
        urgencyLevel:
          type: string
          enum: [low, moderate, high, emergency]
        specialistRecommended:
          type: string
        careSuggestion:
          type: string
          enum: [home_care, clinic_visit, emergency_care]
        aiSummary:
          type: ["string", "null"]
        disclaimer:
          type: string
        linkedReportId:
          type: ["integer", "null"]
        linkedAppointmentId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    TriageSummary:
      type: object
      required: [total, low, moderate, high, emergency, recentSessions]
      properties:
        total:
          type: integer
        low:
          type: integer
        moderate:
          type: integer
        high:
          type: integer
        emergency:
          type: integer
        recentSessions:
          type: array
          items:
            $ref: "#/components/schemas/TriageSession"

    # ---- REPORTS ----
    ReportInput:
      type: object
      required: [userId, reportType, title]
      properties:
        userId:
          type: string
        reportType:
          type: string
          enum: [prescription, blood_test, urine_test, xray, mri, ct_scan, ecg, ultrasound, discharge_summary, other]
        title:
          type: string
        rawText:
          type: string
        imageBase64:
          type: ["string", "null"]

    MedicalReport:
      type: object
      required: [id, userId, reportType, title, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        reportType:
          type: string
        title:
          type: string
        rawText:
          type: ["string", "null"]
        simplifiedText:
          type: ["string", "null"]
        abnormalValues:
          type: ["string", "null"]
        specialistSuggestion:
          type: ["string", "null"]
        linkedTriageId:
          type: ["integer", "null"]
        linkedAppointmentId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    # ---- APPOINTMENTS ----
    AppointmentInput:
      type: object
      required: [userId, doctorId, scheduledAt, reason]
      properties:
        userId:
          type: string
        doctorId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        reason:
          type: string
        linkedTriageId:
          type: ["integer", "null"]
        linkedReportId:
          type: ["integer", "null"]

    AppointmentUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [scheduled, confirmed, completed, cancelled]
        scheduledAt:
          type: string
          format: date-time

    Appointment:
      type: object
      required: [id, userId, doctorId, scheduledAt, status, reason, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        doctorId:
          type: integer
        doctor:
          $ref: "#/components/schemas/Doctor"
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
        reason:
          type: string
        linkedTriageId:
          type: ["integer", "null"]
        linkedReportId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    Doctor:
      type: object
      required: [id, name, specialty, hospital, city, fees, rating, availableSlots]
      properties:
        id:
          type: integer
        name:
          type: string
        specialty:
          type: string
        hospital:
          type: string
        city:
          type: string
        fees:
          type: number
        rating:
          type: number
        avatarUrl:
          type: ["string", "null"]
        availableSlots:
          type: array
          items:
            type: string

    # ---- HEALTH RECORDS ----
    HealthRecordInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
        bloodGroup:
          type: ["string", "null"]
        allergies:
          type: ["string", "null"]
        chronicConditions:
          type: ["string", "null"]
        currentMedications:
          type: ["string", "null"]
        emergencyContact:
          type: ["string", "null"]
        height:
          type: ["number", "null"]
        weight:
          type: ["number", "null"]

    HealthRecordUpdate:
      type: object
      properties:
        bloodGroup:
          type: ["string", "null"]
        allergies:
          type: ["string", "null"]
        chronicConditions:
          type: ["string", "null"]
        currentMedications:
          type: ["string", "null"]
        emergencyContact:
          type: ["string", "null"]
        height:
          type: ["number", "null"]
        weight:
          type: ["number", "null"]

    HealthRecord:
      type: object
      required: [id, userId, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        bloodGroup:
          type: ["string", "null"]
        allergies:
          type: ["string", "null"]
        chronicConditions:
          type: ["string", "null"]
        currentMedications:
          type: ["string", "null"]
        emergencyContact:
          type: ["string", "null"]
        height:
          type: ["number", "null"]
        weight:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HealthHistoryEventInput:
      type: object
      required: [sourceType, sourceId, occurredAt, text]
      properties:
        sourceType:
          type: string
          enum: [triage, report, pre_consultation]
        sourceId:
          type: string
        occurredAt:
          type: string
          format: date-time
        text:
          type: string
          minLength: 1
          maxLength: 6000

    HealthPatternAnalysisInput:
      type: object
      required: [userId, language, events]
      properties:
        userId:
          type: string
        language:
          type: string
        events:
          type: array
          minItems: 2
          maxItems: 50
          items:
            $ref: "#/components/schemas/HealthHistoryEventInput"

    HealthPatternObservation:
      type: object
      required: [title, observation, evidenceCount, confidence, caution]
      properties:
        title:
          type: string
        observation:
          type: string
        evidenceCount:
          type: integer
          minimum: 2
        confidence:
          type: string
          enum: [possible, recurring]
        caution:
          type: string

    HealthPatternAnalysis:
      type: object
      required: [patterns, analyzedAt, disclaimer]
      properties:
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/HealthPatternObservation"
        analyzedAt:
          type: string
          format: date-time
        disclaimer:
          type: string

    SurgeryInput:
      type: object
      required: [userId, procedureName, date]
      properties:
        userId:
          type: string
        procedureName:
          type: string
        date:
          type: string
        hospital:
          type: ["string", "null"]
        surgeon:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    Surgery:
      type: object
      required: [id, userId, procedureName, date, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        procedureName:
          type: string
        date:
          type: string
        hospital:
          type: ["string", "null"]
        surgeon:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ---- TRACKER ----
    TrackerEntryInput:
      type: object
      required: [userId, date]
      properties:
        userId:
          type: string
        date:
          type: string
        hydration:
          type: ["number", "null"]
        sleepHours:
          type: ["number", "null"]
        stressLevel:
          type: ["integer", "null"]
        activityMinutes:
          type: ["integer", "null"]
        symptoms:
          type: ["string", "null"]
        mood:
          type: ["string", "null"]

    TrackerEntry:
      type: object
      required: [id, userId, date, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        date:
          type: string
        hydration:
          type: ["number", "null"]
        sleepHours:
          type: ["number", "null"]
        stressLevel:
          type: ["integer", "null"]
        activityMinutes:
          type: ["integer", "null"]
        symptoms:
          type: ["string", "null"]
        mood:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    TrackerInsights:
      type: object
      required: [userId, insights, riskLevel, tips]
      properties:
        userId:
          type: string
        insights:
          type: string
        riskLevel:
          type: string
          enum: [low, moderate, high]
        tips:
          type: array
          items:
            type: string
        weeklyAvgSleep:
          type: ["number", "null"]
        weeklyAvgHydration:
          type: ["number", "null"]
        weeklyAvgStress:
          type: ["number", "null"]

    # ---- CARE CIRCLE ----
    CareCircleMemberInput:
      type: object
      required: [userId, memberName, relationship]
      properties:
        userId:
          type: string
        memberName:
          type: string
        relationship:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        linkedUserId:
          type: ["string", "null"]
        careRole:
          type: ["string", "null"]

    CareCircleMember:
      type: object
      required: [id, userId, memberName, relationship, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        memberName:
          type: string
        relationship:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        linkedUserId:
          type: ["string", "null"]
        careRole:
          type: ["string", "null"]
        verificationStatus:
          type: string
        healthStatus:
          type: ["string", "null"]
        lastSeen:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CareAlert:
      type: object
      required: [id, userId, alertType, message, severity, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        memberId:
          type: ["integer", "null"]
        memberName:
          type: ["string", "null"]
        alertType:
          type: string
          enum: [missed_medication, high_risk, inactivity, emergency]
        message:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    EmergencyAlertInput:
      type: object
      required: [userId, patientName]
      properties:
        userId:
          type: string
        patientName:
          type: string
          minLength: 1
        latitude:
          type: ["number", "null"]
          minimum: -90
          maximum: 90
        longitude:
          type: ["number", "null"]
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0

    EmergencyAlertResult:
      type: object
      required: [id, alertedLinkedMembers, totalCareCircleMembers, createdAt]
      properties:
        id:
          type: integer
        alertedLinkedMembers:
          type: integer
          minimum: 0
        totalCareCircleMembers:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time

    SushruthIdentity:
      type: object
      required: [sushruthId]
      properties:
        sushruthId: { type: string }

    CareCircleConnectionRequestInput:
      type: object
      required: [userId, requesterName, targetSushruthId]
      properties:
        userId: { type: string }
        requesterName: { type: string, minLength: 1 }
        targetSushruthId: { type: string, minLength: 10, maxLength: 10 }
        relationship: { type: ["string", "null"] }

    CareCircleConnectionResponseInput:
      type: object
      required: [userId, recipientName, action]
      properties:
        userId: { type: string }
        recipientName: { type: string, minLength: 1 }
        action: { type: string, enum: [ACCEPT, REJECT] }
        relationship: { type: ["string", "null"] }

    CareCircleConnectionRequest:
      type: object
      required: [id, requesterUserId, requesterName, recipientUserId, status, direction, createdAt]
      properties:
        id: { type: integer }
        requesterUserId: { type: string }
        requesterName: { type: string }
        recipientUserId: { type: string }
        recipientName: { type: ["string", "null"] }
        relationship: { type: ["string", "null"] }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, REMOVED] }
        direction: { type: string, enum: [INCOMING, OUTGOING] }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: ["string", "null"], format: date-time }

    EmergencyAlertAcknowledgeInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string }

    EmergencyAlertRecipientStatus:
      type: object
      required: [recipientName, status, sentAt]
      properties:
        recipientName: { type: string }
        status: { type: string, enum: [SENT, SEEN, RESPONDING] }
        sentAt: { type: string, format: date-time }
        seenAt: { type: ["string", "null"], format: date-time }
        acknowledgedAt: { type: ["string", "null"], format: date-time }

    EmergencyAlertHistoryItem:
      type: object
      required: [id, patientUserId, patientName, sushruthId, status, createdAt, direction, recipients]
      properties:
        id: { type: integer }
        patientUserId: { type: string }
        patientName: { type: string }
        sushruthId: { type: string }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        direction: { type: string, enum: [SENT, RECEIVED] }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/EmergencyAlertRecipientStatus" }

    CareCircleVaultItemInput:
      type: object
      required: [userId, memberId, title, documentType, fileName, objectPath, contentType, fileSize]
      properties:
        userId: { type: string }
        memberId: { type: integer }
        title: { type: string, minLength: 1 }
        documentType: { type: string }
        fileName: { type: string }
        objectPath: { type: string }
        contentType: { type: string }
        fileSize: { type: integer, minimum: 1 }

    CareCircleVaultItem:
      type: object
      required: [id, userId, memberId, title, documentType, fileName, objectPath, contentType, fileSize, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        memberId: { type: integer }
        title: { type: string }
        documentType: { type: string }
        fileName: { type: string }
        objectPath: { type: string }
        contentType: { type: string }
        fileSize: { type: integer }
        createdAt: { type: string, format: date-time }

    CareCircleVaultUploadUrlInput:
      type: object
      required: [userId, fileName, contentType, fileSize]
      properties:
        userId: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        fileSize: { type: integer, minimum: 1 }

    CareCircleVaultUploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, expiresIn]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        expiresIn: { type: integer }

    CareCircleVaultDownloadResponse:
      type: object
      required: [downloadURL, expiresIn]
      properties:
        downloadURL: { type: string, format: uri }
        expiresIn: { type: integer }

    CareCircleIdentityVerificationInput:
      type: object
      required: [userId, memberId, legalName, documentType, documentLast4, documentVaultItemId]
      properties:
        userId: { type: string }
        memberId: { type: integer }
        legalName: { type: string, minLength: 1 }
        documentType: { type: string }
        documentLast4: { type: string, minLength: 4, maxLength: 4 }
        documentVaultItemId: { type: integer }

    CareCircleIdentityVerification:
      type: object
      required: [id, userId, memberId, legalName, documentType, documentLast4, status, submittedAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        memberId: { type: integer }
        legalName: { type: string }
        documentType: { type: string }
        documentLast4: { type: string }
        documentVaultItemId: { type: ["integer", "null"] }
        status: { type: string }
        reviewNotes: { type: ["string", "null"] }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: ["string", "null"], format: date-time }

    CareCircleDutyInput:
      type: object
      required: [userId, memberId, title, category, frequency]
      properties:
        userId: { type: string }
        memberId: { type: integer }
        assignedToMemberId: { type: ["integer", "null"] }
        title: { type: string, minLength: 1 }
        category: { type: string }
        frequency: { type: string }
        instructions: { type: ["string", "null"] }

    CareCircleDuty:
      type: object
      required: [id, userId, memberId, title, category, frequency, isActive, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        memberId: { type: integer }
        assignedToMemberId: { type: ["integer", "null"] }
        title: { type: string }
        category: { type: string }
        frequency: { type: string }
        instructions: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    CareCircleDailyCareLogInput:
      type: object
      required: [userId, memberId, careDate, category, status]
      properties:
        userId: { type: string }
        memberId: { type: integer }
        dutyId: { type: ["integer", "null"] }
        careDate: { type: string, format: date }
        category: { type: string }
        status: { type: string }
        notes: { type: ["string", "null"] }
        recordedBy: { type: ["string", "null"] }

    CareCircleDailyCareLog:
      type: object
      required: [id, userId, memberId, careDate, category, status, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        memberId: { type: integer }
        dutyId: { type: ["integer", "null"] }
        careDate: { type: string, format: date }
        category: { type: string }
        status: { type: string }
        notes: { type: ["string", "null"] }
        recordedBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    # ---- MEDICATIONS ----
    MedicationInput:
      type: object
      required: [userId, name, dosage, frequency]
      properties:
        userId:
          type: string
        name:
          type: string
        dosage:
          type: string
        frequency:
          type: string
        timings:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        prescribedBy:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    MedicationUpdate:
      type: object
      properties:
        name:
          type: string
        dosage:
          type: string
        frequency:
          type: string
        timings:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    Medication:
      type: object
      required: [id, userId, name, dosage, frequency, isActive, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        dosage:
          type: string
        frequency:
          type: string
        timings:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        prescribedBy:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MedicationTakenInput:
      type: object
      required: [takenAt]
      properties:
        takenAt:
          type: string
          format: date-time
        notes:
          type: ["string", "null"]

    MedicationLog:
      type: object
      required: [id, medicationId, userId, takenAt, createdAt]
      properties:
        id:
          type: integer
        medicationId:
          type: integer
        userId:
          type: string
        takenAt:
          type: string
          format: date-time
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ---- OPENAI ----
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiVoiceMessageInput:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded audio data
      required:
        - audio

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
