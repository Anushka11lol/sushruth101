kind = "web"
previewPath = "/"
title = "Sushruth - AI Healthcare Assistant"
version = "1.0.0"
id = "artifacts/sushruth"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23625

[services.development]
run = "pnpm --filter @workspace/sushruth run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sushruth", "run", "build" ]
publicDir = "artifacts/sushruth/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23625"
BASE_PATH = "/"
